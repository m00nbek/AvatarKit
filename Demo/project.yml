name: AvatarDemo
options:
  bundleIdPrefix: com.m00nbek
  deploymentTarget:
    iOS: "17.0"
packages:
  AvatarKit:
    path: ..
targets:
  AvatarDemo:
    type: application
    platform: iOS
    sources:
      - path: AvatarDemo
        excludes: [Bakeoff]
      # Built by Tools/bakeoff/build-bakeoff.mjs; a folder so Items/ keeps its path in the bundle.
      - path: AvatarDemo/Bakeoff
        type: folder
        optional: true
    dependencies:
      - package: AvatarKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m00nbek.AvatarDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Avatar
        INFOPLIST_KEY_NSCameraUsageDescription: Take a selfie to create your avatar. The photo isn't saved.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
